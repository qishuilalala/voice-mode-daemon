<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extensionName"></title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 12px;
        font-size: 13px;
        line-height: 1.45;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.2);
      }
      .badge[data-state="ready"] {
        background: rgba(34, 197, 94, 0.22);
      }
      .badge[data-state="fallback"] {
        background: rgba(245, 158, 11, 0.25);
      }
      section,
      details {
        border: 1px solid rgba(120, 120, 128, 0.28);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
      }
      summary {
        font-weight: 600;
        cursor: pointer;
      }
      details[open] summary {
        margin-bottom: 8px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      input[type="text"],
      input[type="password"],
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(120, 120, 128, 0.38);
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(120, 120, 128, 0.4);
        cursor: pointer;
      }
      #status-log {
        font-size: 12px;
        opacity: 0.85;
        min-height: 18px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>
      <span data-i18n="extensionName"></span>
      <span id="daemon-badge" class="badge" data-state="checking" data-i18n="checkingBadge"></span>
    </h1>

    <section>
      <label for="daemon-url" data-i18n="daemonUrlLabel"></label>
      <input id="daemon-url" type="text" value="http://127.0.0.1:18790" />

      <label for="daemon-token" data-i18n="daemonTokenLabel"></label>
      <input id="daemon-token" type="password" data-i18n-placeholder="daemonTokenPlaceholder" />

      <label for="voice-select" data-i18n="voiceLabel"></label>
      <select id="voice-select"></select>

      <label for="asr-model-select" data-i18n="asrLabel"></label>
      <select id="asr-model-select">
        <option value="zipformer2" data-i18n="zipformer2Label"></option>
        <option value="sensevoice" data-i18n="sensevoiceLabel"></option>
      </select>

      <div class="row">
        <button id="save-btn" type="button" data-i18n="saveButton"></button>
        <button id="grant-site-btn" type="button" data-i18n="grantSiteButton"></button>
      </div>
    </section>

    <details id="byok-section">
      <summary data-i18n="cloudFallbackHeading"></summary>
      <label for="byok-base-url" data-i18n="cloudUrlLabel"></label>
      <input id="byok-base-url" type="text" placeholder="https://api.openai.com/v1" />

      <label for="byok-api-key" data-i18n="cloudKeyLabel"></label>
      <input id="byok-api-key" type="password" placeholder="sk-..." />

      <label for="byok-tts-model" data-i18n="cloudTtsModelLabel"></label>
      <input id="byok-tts-model" type="text" value="gpt-4o-mini-tts" />

      <label for="byok-asr-model" data-i18n="cloudAsrModelLabel"></label>
      <input id="byok-asr-model" type="text" value="whisper-1" />
    </details>

    <section>
      <label for="read-input" data-i18n="readLabel"></label>
      <textarea id="read-input" rows="3" data-i18n-placeholder="readPlaceholder"></textarea>
      <div class="row">
        <button id="read-page-btn" type="button" data-i18n="readPageButton"></button>
        <button id="speak-text-btn" type="button" data-i18n="speakTextButton"></button>
        <button id="stop-btn" type="button" data-i18n="stopButton"></button>
      </div>
    </section>

    <section>
      <label for="dictation-preview" data-i18n="dictationLabel"></label>
      <textarea id="dictation-preview" rows="2" data-i18n-placeholder="dictationPlaceholder"></textarea>
      <div class="row">
        <button id="mic-btn" type="button" data-i18n="startMicButton"></button>
        <button id="inject-btn" type="button" data-i18n="injectButton"></button>
      </div>
    </section>

    <div id="status-log" role="status" data-i18n="checkingStatus"></div>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
